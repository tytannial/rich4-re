# [NEW] CI（docs/testing.md §4 设计）：L0 单测可在无游戏资源环境跑（test_save/test_mkf
# 对缺失资源自动 SKIP）；L1 场景需要 resources/game（版权不入库）→ 本地/自托管跑：
#   python tools/run_tests.py --wall-cap 90
name: tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  unit-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: configure (SDL3 via FetchContent)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build --target rich4_tests
      - name: unit
        run: ctest --test-dir build -R unit --output-on-failure

  unit-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build --target rich4_tests
      - name: unit
        run: ctest --test-dir build -R unit --output-on-failure

  # L1 headless 场景（需要 resources/game 的私有 runner / 本地 CI 循环）：
  #   ./build/rich4.exe --game resources/game --headless ... （见 tools/run_tests.py）
  #   注：Linux 下随机序列与 MSVC 不同（ISS-007/013 记录）→ 场景断言均走定点注入，
  #   平台无关；仅 80_autoplay 的回合内容随种子平台变化（不变量断言不受影响）。
